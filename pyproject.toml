# ============================================================================
#  RUFF — линтер + форматтер (замена flake8 / isort / black)
#  Запуск:  ruff check .        — проверить
#           ruff check . --fix  — починить автоисправимое
#           ruff format .       — отформатировать
# ============================================================================
[tool.ruff]
# Максимальная длина строки. Её же использует форматтер при переносах.
line-length = 100

# Минимальная версия Python, на которую ориентируется линтер:
# правила UP не предложат синтаксис новее 3.12 (в venv сейчас 3.13 — можно поднять до "py313").
target-version = "py312"

# Корни проекта для резолва импортов (нужно правилу I — isort),
# чтобы `products`, `orders` и т.д. считались "своими", а не сторонними пакетами.
src = ["."]

# Файлы, которые не трогаем: автогенерённые миграции, окружение, статика.
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "static",
    "media",
]

[tool.ruff.lint]
# Какие наборы правил включить (префикс = плагин flake8):
select = [
    "E",    # pycodestyle errors — отступы, пробелы, длина строки
    "W",    # pycodestyle warnings — пробелы в конце строки, перевод строки в конце файла
    "F",    # pyflakes — неиспользуемые импорты/переменные, необъявленные имена (реальные баги)
    "I",    # isort — порядок и группировка импортов
    "N",    # pep8-naming — именование классов/функций/переменных
    "UP",   # pyupgrade — устаревшие конструкции (Optional[X] -> X | None и т.п.)
    "B",    # flake8-bugbear — типичные ловушки (мутабельный аргумент по умолчанию и др.)
    "C4",   # flake8-comprehensions — списки/словари через генераторы вместо list()/dict()
    "DJ",   # flake8-django — специфика Django (null=True на CharField, отсутствие __str__, ...)
    "SIM",  # flake8-simplify — упрощение условий и with/try
    "RUF",  # собственные правила ruff (в т.ч. кириллица, похожая на латиницу)
]

# Точечные исключения из выбранных наборов:
ignore = [
    "E501",    # длину строки контролирует форматтер, а не линтер — иначе дубль ошибок
    "RUF001",  # "кириллическая буква похожа на латинскую" — у нас тексты на русском
    "RUF002",  # то же самое внутри docstring
    "RUF003",  # то же самое внутри комментариев
    "RUF012",  # ClassVar для mutable-атрибутов класса — ломает стиль Django (list_display и пр.)
    "B008",    # вызов функции в значении аргумента по умолчанию — норма для DRF/FastAPI-стиля
]

# Что ruff считает "намеренно неиспользуемой" переменной: _ , __ , _foo
dummy-variable-rgx = "^_.*$"

# Исключения для конкретных файлов
[tool.ruff.lint.per-file-ignores]
# В settings звёздочный импорт `from .base import *` — это норма для Django.
"config/settings/*.py" = ["F403", "F405"]
# В миграциях длинные строки и странные имена классов — это генератор, не мы.
"*/migrations/*.py" = ["E501", "N806"]
# В __init__.py импорт "ради реэкспорта" без использования — норма.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
# Импорты этих пакетов идут в отдельную группу "первая сторона" (свой код проекта).
known-first-party = ["config", "orders", "products", "payments", "reviews", "users"]
# django/DRF выносим в отдельную группу между stdlib и остальными сторонними.
known-third-party = ["django", "rest_framework"]

[tool.ruff.format]
# Кавычки: в проекте везде одинарные — форматтер не будет переписывать их на двойные.
quote-style = "single"
# Отступы пробелами (не табами).
indent-style = "space"
# Перевод строки LF — одинаково на macOS/Linux/Windows и в git.
line-ending = "lf"
# Форматировать примеры кода внутри docstring'ов.
docstring-code-format = true

# ============================================================================
#  MYPY — статическая проверка типов
#  Запуск:  mypy .
# ============================================================================
[tool.mypy]
# Версия синтаксиса/стандартной библиотеки, под которую проверяем код.
python_version = '3.12'

# Плагин django-stubs: учит mypy понимать ORM — типы полей модели,
# related_name, Manager/QuerySet, settings и т.д. Без него Django почти не типизируется.
plugins = ['mypy_django_plugin.main']

# Не ругаться на сторонние пакеты без типов (dotenv, pillow, ...).
ignore_missing_imports = true

# Ругаться на `# type: ignore`, который уже ничего не подавляет, — чтобы не копились мёртвые.
warn_unused_ignores = true

# Ругаться на бесполезный cast(X, ...), где значение и так типа X.
warn_redundant_casts = true

# Ругаться на неиспользуемые/ошибочные секции в этом конфиге.
warn_unused_configs = true

# Функция объявлена как -> int, а возвращает Any — предупредить.
warn_return_any = true

# `def f(x: int = None)` больше не считается Optional автоматически — нужен `int | None`.
no_implicit_optional = true

# Проверять тела функций даже без аннотаций — иначе mypy молча пропускает почти весь код.
check_untyped_defs = true

# Не требовать аннотации у всех функций (включи true, когда типы будут проставлены везде).
disallow_untyped_defs = false

# Показывать код ошибки [attr-defined] — по нему удобно гуглить и точечно подавлять.
show_error_codes = true

# Читаемый вывод с подсветкой строки, где ошибка.
pretty = true

# Директории, которые не проверяем.
exclude = '(^|/)(migrations|\.venv|static|media)/'

# ============================================================================
#  DJANGO-STUBS — конфигурация плагина, который подключён выше
# ============================================================================
[tool.django-stubs]
# Какие настройки импортировать, чтобы плагин увидел INSTALLED_APPS и модели.
# Тот же модуль, что и в manage.py.
django_settings_module = 'config.settings.test'
